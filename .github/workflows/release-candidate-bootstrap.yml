name: Release Candidate bootstrap

on:
  push:
    branches:
      - feature/cagliari-bootstrap
  pull_request:
    branches:
      - master

jobs:
  bootstrap-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run bootstrap tests
        run: python -m unittest tests/test_release_candidate_bootstrap.py -v
